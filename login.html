<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Flowers — Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Nana Flowers</a>
            <ul class="list">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Catalogue</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="contact.html">Order</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html" class="active">Login</a></li>
            </ul>
            <button id="themeToggle" class="theme-toggle" type="button">Dark mode</button>
        </nav>
    </header>

    <main class="contact-page">
        <div class="container">
            <div class="contact-wrapper" style="grid-template-columns: 1fr; max-width: 500px; margin: 0 auto;">
                <div class="contact-form-card">
                    <h2 class="text-center">Welcome Back</h2>
                    <div class="divider"></div>

                    <form id="loginForm" novalidate>
                        <div class="input-box mb-3">
                            <label for="loginEmail">Email</label>
                            <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
                        </div>
                        <div class="input-box mb-4">
                            <label for="loginPassword">Password</label>
                            <input type="password" id="loginPassword" class="form-control" placeholder="Enter password" required>
                        </div>
                        <button type="submit" class="btn-send-main">Log In</button>
                    </form>

                    <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
                    <p class="text-center mt-3">No account? <a href="register.html" style="color: #2E7D5B;">Register</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer__columns">
            <div class="footer__col"><h3>Nana Flowers</h3></div>
        </div>
    </footer>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const errBox = document.getElementById('loginError');

            if (!this.checkValidity()) {
                this.classList.add('was-validated');
                return;
            }

            const result = loginUser(email, pass);
            if (result.success) {
                window.location.href = 'profile.html';
            } else {
                errBox.textContent = result.message;
                errBox.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
