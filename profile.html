<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nana Flowers — Profile</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <nav class="navbar">
            <a href="index.html" class="logo">Nana Flowers</a>
            <ul class="list">
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Catalogue</a></li>
                <li><a href="aboutus.html">About Us</a></li>
                <li><a href="contact.html">Order</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
            <button id="themeToggle" class="theme-toggle" type="button">Dark mode</button>
        </nav>
    </header>

    <main class="contact-page">
        <div class="container">
            <div class="contact-wrapper" style="grid-template-columns: 1fr; max-width: 500px; margin: 0 auto;">
                <div class="contact-form-card">
                    <h2>Hello, <span id="userNameDisplay"></span>!</h2>
                    <div class="divider"></div>
                    <div id="profileDetails" class="mb-4"></div>
                    <button id="logoutBtn" class="btn-send-main" style="background: #E88AA0;">Log Out</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        const currentUser = checkAuth();

        if (currentUser) {
            document.getElementById('userNameDisplay').textContent = currentUser.firstName;
            document.getElementById('profileDetails').innerHTML = `
                <p><strong>Name:</strong> ${currentUser.firstName} ${currentUser.lastName}</p>
                <p><strong>Email:</strong> ${currentUser.email}</p>
                <p><strong>Country:</strong> ${currentUser.country}</p>
            `;
            document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        }
    </script>
</body>
</html>
